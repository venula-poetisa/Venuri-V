<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta id="metaDescription"
          name="description"
          content="">

    <title id="pageTitle">Venuri V. | Portfolio</title>

    <link id="favicon"
          rel="icon"
          type="image/x-icon"
          href="content/favicon.png">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<header class="site-header" id="header">

    <a class="brand" href="#intro" id="brand">
        Venuri<span> V.</span>
    </a>


    <nav class="desktop-nav" aria-label="Main navigation">

        <a class="active" href="#intro">Home</a>

        <a href="#about">About</a>

        <a href="#edu">Education</a>

        <a href="#exp">Experience</a>

        <a href="#skills">Skills</a>

        <a href="#projects">Projects</a>

        <a href="#future">Future</a>

        <a href="#contact-section">Contact</a>

    </nav>


    <div class="header-actions">

        <a id="headerEmail"
           href="#"
           title="Email">

            <i class="fa-solid fa-envelope"></i>

        </a>


        <a id="headerGithub"
           href="#"
           target="_blank"
           rel="noopener"
           title="GitHub">

            <i class="fa-brands fa-github"></i>

        </a>


        <a id="headerLinkedin"
           href="#"
           target="_blank"
           rel="noopener"
           title="LinkedIn">

            <i class="fa-brands fa-linkedin"></i>

        </a>


        <a id="headerResume"
           href="#"
           target="_blank"
           title="Resume">

            <i class="fa-solid fa-file-lines"></i>

        </a>


        <button class="icon-button mobile-menu-button"
                id="menuBtn"
                aria-label="Open menu">

            <i class="fa-solid fa-bars"></i>

        </button>

    </div>

</header>



<main>


<!-- ==================== HERO ==================== -->

<section class="hero section" id="intro">

    <div class="hero-copy">

        <p class="eyebrow">

            <span></span>

            <span id="heroEyebrow"></span>

        </p>


        <h1>

            <span id="heroHeading"></span>

            <em id="heroHeadingEmphasis"></em>

            <br>

            I love creating.

        </h1>


        <p class="hero-text"
           id="heroDescription">
        </p>


        <div class="hero-actions">

            <a class="button primary"
               id="heroPrimaryButton"
               href="#projects">

                <span></span>

                <i class="fa-solid fa-arrow-down"></i>

            </a>


            <a class="button secondary"
               id="heroResumeButton"
               href="#"
               target="_blank">

                <span></span>

                <i class="fa-solid fa-arrow-up-right-from-square"></i>

            </a>

        </div>


        <div class="quick-stats"
             id="quickStats">
        </div>

    </div>



    <div class="hero-visual">

        <div class="hero-card">

            <div class="code-top">

                <span></span>
                <span></span>
                <span></span>

                <small id="codeFilename">
                    venuri.js
                </small>

            </div>


            <pre><code><span class="purple">const</span> developer = {
  name: <span class="pink" id="codeName"></span>,
  focus: <span class="pink" id="codeFocus"></span>,
  stack: [<span class="pink" id="codeStack"></span>],
  mindset: <span class="pink" id="codeMindset"></span>
};</code></pre>

        </div>


        <div id="heroBadges"></div>

    </div>

</section>



<!-- ==================== ABOUT ==================== -->

<section class="section about-section" id="about">

    <div class="section-heading">

        <p class="eyebrow" id="aboutEyebrow"></p>

        <h2 id="aboutHeading"></h2>

    </div>


    <div class="about-grid">

        <div class="about-content">

            <p class="lead"
               id="aboutLead">
            </p>


            <div id="aboutParagraphs"></div>


            <div class="tech-pills"
                 id="techPills">
            </div>

        </div>


        <div class="portrait-wrap">

            <div class="portrait-frame">

                <img id="profilePhoto"
                     src=""
                     alt="Venuri">

            </div>


            <div class="portrait-caption">

                <span></span>

                <span id="photoCaption"></span>

            </div>

        </div>

    </div>

</section>



<!-- ==================== EDUCATION ==================== -->

<section class="section soft-section" id="edu">

    <div class="section-heading centered">

        <p class="eyebrow">
            02 / Education
        </p>

        <h2>
            My academic path.
        </h2>

    </div>


    <div class="timeline"
         id="educationList">
    </div>

</section>



<!-- ==================== EXPERIENCE ==================== -->

<section class="section" id="exp">

    <div class="section-heading centered">

        <p class="eyebrow">
            03 / Experience
        </p>

        <h2>
            Where I've worked.
        </h2>

    </div>


    <div class="experience-grid"
         id="experienceList">
    </div>

</section>



<!-- ==================== SKILLS ==================== -->

<section class="section soft-section" id="skills">

    <div class="section-heading centered">

        <p class="eyebrow"
           id="skillsEyebrow">
        </p>

        <h2 id="skillsHeading"></h2>

        <p class="section-subtitle"
           id="skillsSubtitle">
        </p>

    </div>


    <div class="skills-layout"
         id="skillsList">
    </div>

</section>



<!-- ==================== PROJECTS ==================== -->

<section class="section projects-section"
         id="projects">

    <div class="section-heading projects-heading">

        <div>

            <p class="eyebrow"
               id="projectsEyebrow">
            </p>

            <h2 id="projectsHeading"></h2>

        </div>


        <p class="section-subtitle"
           id="projectsSubtitle">
        </p>

    </div>


    <div id="featuredProject"></div>

    <div class="project-grid"
         id="projectGrid">
    </div>

</section>



<!-- ==================== FUTURE ==================== -->

<section class="section roadmap-section"
         id="future">

    <div class="section-heading centered">

        <p class="eyebrow"
           id="futureEyebrow">
        </p>

        <h2 id="futureHeading"></h2>

        <p class="section-subtitle"
           id="futureSubtitle">
        </p>

    </div>


    <div class="roadmap"
         id="futureProjects">
    </div>

</section>



<!-- ==================== CONTACT ==================== -->

<section class="section contact-section"
         id="contact-section">

    <div class="contact-card">

        <div>

            <p class="eyebrow"
               id="contactEyebrow">
            </p>

            <h2 id="contactHeading"></h2>

            <p id="contactDescription"></p>

        </div>


        <div class="contact-actions">

            <a class="button primary"
               id="contactEmail"
               href="#">

                <span id="contactEmailText"></span>

                <i class="fa-solid fa-arrow-right"></i>

            </a>


            <div class="contact-links">

                <a id="contactGithub"
                   href="#"
                   target="_blank"
                   rel="noopener">
                </a>


                <a id="contactLinkedin"
                   href="#"
                   target="_blank"
                   rel="noopener">
                </a>

            </div>

        </div>

    </div>

</section>

</main>



<!-- ==================== FOOTER ==================== -->

<footer>

    <p id="footerText"></p>

    <a href="#intro"
       id="footerBack">
    </a>

</footer>



<!-- ==================== THEME ==================== -->

<button class="theme-toggle"
        id="themeBtn"
        aria-label="Toggle dark mode">

    ☾

</button>



<script src="script.js"></script>

</body>

</html>
