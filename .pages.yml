# Local media storage inside your GitHub repo
media:
  input: public/content/images
  output: /content/images

content:
  - name: projects
    label: Portfolio Projects
    type: file
    path: public/data/projects.json
    list: true
    fields:
      - name: title
        label: Project Title
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: image
        label: Cover Image
        type: image

      - name: github
        label: GitHub URL
        type: string

      - name: tags
        label: Tech Stack / Tags
        type: list
        field:
          type: string