# Media configuration using Cloudinary
media:
  input: public/content
  output: /content
  # You can connect Cloudinary in Pages CMS settings

# Content configuration (Replaces your old admin dashboard)
content:
  - name: projects
    label: Projects
    type: file
    path: public/data/projects.json
    list: true
    fields:
      - name: title
        label: Project Title
        type: string
      - name: description
        label: Description
        type: text
      - name: image
        label: Cover Image
        type: image
      - name: github
        label: GitHub URL
        type: string
      - name: tags
        label: Tech Stack
        type: list
        field:
          type: string