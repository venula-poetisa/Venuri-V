media:
  input: images
  output: /images

content:
  - name: projects
    label: Portfolio Projects
    type: file
    path: content/projects.json
    format: json
    list: true

    fields:
      - name: title
        label: Project Title
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: image
        label: Project Image
        type: image

      - name: github
        label: GitHub URL
        type: string

      - name: tags
        label: Tech Stack
        type: string
        list: true